services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      - OCTOPROX_AUTH_USERNAME=admin
      - OCTOPROX_AUTH_PASSWORD=admin
      - OCTOPROX_JWT_SECRET=change-me-in-production
      - OCTOPROX_ENV=production
      - OCTOPROX_REDIS_URL=redis://redis:6379/0
      - OCTOPROX_DB_HOST=postgres
      - OCTOPROX_DB_PORT=5432
      - OCTOPROX_DB_USER=octoprox
      - OCTOPROX_DB_PASSWORD=octoprox
      - OCTOPROX_DB_NAME=octoprox
      - OCTOPROX_LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ca_data:/app/data/ca
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=octoprox
      - POSTGRES_PASSWORD=octoprox
      - POSTGRES_DB=octoprox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octoprox"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ca_data:
