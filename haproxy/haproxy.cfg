# HAProxy config for the local Octoprox multi-instance cluster.
#
# Two frontends:
#   :8000 - Management API + Web UI (HTTP, L7)
#   :8080 - Proxy traffic (raw TCP, L4 - the proxy speaks its own
#           CONNECT/SOCKS handshake so HAProxy must not try to parse it)
#
# Both frontends use the SAME health probe (HTTP GET /health on port
# 8000) so we never route 8080 traffic to an instance whose API has
# crashed. `balance leastconn` on the TCP frontend keeps long-lived
# tunnels evenly distributed.
#
# The HTTP backend pins each browser to one replica with a cookie. Every
# instance keeps its own in-memory copy of projects, credentials,
# connectors and proxies and learns about the others' writes through
# Redis a moment later, so a client that creates something on replica A
# and immediately lists on replica B could miss its own write. Stickiness
# gives the UI read-your-writes without changing the instances. If the
# pinned replica goes down, `option redispatch` moves the client to a
# healthy one.

global
    log stdout format raw local0 info
    maxconn 20000

defaults
    log     global
    timeout connect 5s
    timeout client  5m
    timeout server  5m
    option  dontlognull
    option  redispatch

# ---------------------------------------------------------------------
# Stats UI - http://localhost:8404/
# ---------------------------------------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends

# ---------------------------------------------------------------------
# Management API / Web UI (HTTP)
# ---------------------------------------------------------------------
frontend api_http_frontend
    bind *:8000
    mode http
    option httplog
    default_backend api_http

backend api_http
    mode http
    # New clients are spread round-robin; the cookie then keeps them on
    # that replica. `indirect nocache` means the cookie is handled by
    # HAProxy only: the instances never see it and caches never store it.
    balance roundrobin
    cookie OCTOPROX_SRV insert indirect nocache httponly
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    server api-1 octoprox-1:8000 cookie api-1 check inter 5s fall 3 rise 2
    server api-2 octoprox-2:8000 cookie api-2 check inter 5s fall 3 rise 2
    server api-3 octoprox-3:8000 cookie api-3 check inter 5s fall 3 rise 2

# ---------------------------------------------------------------------
# Proxy traffic (TCP)
# ---------------------------------------------------------------------
frontend proxy_tcp_frontend
    bind *:8080
    mode tcp
    option tcplog
    default_backend proxy_tcp

backend proxy_tcp
    mode tcp
    balance leastconn
    # Probe the HTTP API health endpoint to decide whether the proxy
    # port on the same container is fit to receive traffic. `port 8000`
    # makes the check connect to a different port than the traffic.
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    server api-1 octoprox-1:8080 check port 8000 inter 5s fall 3 rise 2
    server api-2 octoprox-2:8080 check port 8000 inter 5s fall 3 rise 2
    server api-3 octoprox-3:8080 check port 8000 inter 5s fall 3 rise 2
