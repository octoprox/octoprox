# Multi-instance Octoprox cluster, fronted by HAProxy. Builds the
# image from this checkout — equivalent to docker-compose.yml but
# scaled out. For a production-ready cluster that pulls the pre-built
# image from GitHub Container Registry, see docker-compose.cluster.ghcr.yml.
#
#   Clients hit HAProxy on port 8000 (API/UI) and 8080 (proxy traffic).
#   HAProxy distributes across octoprox-{1,2,3}, all sharing Postgres
#   and Redis. Health checks use GET /health on each instance's API.
#
# Start:   docker compose -f docker-compose.cluster.yml up -d --build
# Stop:    docker compose -f docker-compose.cluster.yml down
# Stats:   http://localhost:8404/
#
# Four compose flavours coexist in this repo:
#   docker-compose.yml              single instance, builds from src
#   docker-compose.ghcr.yml         single instance, pre-built image
#   docker-compose.cluster.yml      cluster, builds from src         (this file)
#   docker-compose.cluster.ghcr.yml cluster, pre-built image

# Shared base for all three octoprox replicas. Each replica overrides
# OCTOPROX_INSTANCE_ID so logs are unambiguous.
x-octoprox-base: &octoprox-base
  build:
    context: .
    dockerfile: Dockerfile
  environment: &octoprox-env
    OCTOPROX_AUTH_USERNAME: admin
    OCTOPROX_AUTH_PASSWORD: admin
    OCTOPROX_JWT_SECRET: change-me-in-production
    OCTOPROX_ENV: production
    OCTOPROX_REDIS_URL: redis://redis:6379/0
    OCTOPROX_DB_HOST: postgres
    OCTOPROX_DB_PORT: "5432"
    OCTOPROX_DB_USER: octoprox
    OCTOPROX_DB_PASSWORD: octoprox
    OCTOPROX_DB_NAME: octoprox
    OCTOPROX_LOG_LEVEL: INFO
  volumes:
    - ./config:/app/config:ro
    - ca_data:/app/data/ca
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s
  restart: unless-stopped

services:
  octoprox-1:
    <<: *octoprox-base
    container_name: octoprox-1
    hostname: octoprox-1
    environment:
      <<: *octoprox-env
      OCTOPROX_INSTANCE_ID: octoprox-1

  octoprox-2:
    <<: *octoprox-base
    container_name: octoprox-2
    hostname: octoprox-2
    environment:
      <<: *octoprox-env
      OCTOPROX_INSTANCE_ID: octoprox-2

  octoprox-3:
    <<: *octoprox-base
    container_name: octoprox-3
    hostname: octoprox-3
    environment:
      <<: *octoprox-env
      OCTOPROX_INSTANCE_ID: octoprox-3

  haproxy:
    image: haproxy:3.2-alpine
    container_name: octoprox-haproxy
    ports:
      - "8000:8000"   # API + Web UI
      - "8080:8080"   # Proxy traffic
      - "8404:8404"   # HAProxy stats UI
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - octoprox-1
      - octoprox-2
      - octoprox-3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: octoprox-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=octoprox
      - POSTGRES_PASSWORD=octoprox
      - POSTGRES_DB=octoprox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octoprox"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: octoprox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ca_data:
