# nginx front for the Octoprox cluster.
#
# Three listeners, all forwarded to the octoprox-{1,2,3} replicas:
#   :8000      Management API + web UI (HTTP, L7)
#   :8080      Proxy traffic (raw TCP, L4: Octoprox speaks its own
#              CONNECT/SOCKS handshake, so nothing here may parse it)
#   :51820/udp WireGuard (UDP, L4: a device is pinned to one replica by
#              its source address; every replica terminates the tunnel)
#   :1194      OpenVPN (UDP and TCP, L4, same pinning; the daemons listen
#              on whichever transport the install's settings name, the
#              other stream server simply has nothing to connect to)
#
# Health is passive, as in open source nginx: a replica that refuses or
# times out is skipped for fail_timeout and the request or datagram goes
# to the next one. For HTTP and TCP that is immediate (the connect fails).
# For UDP a dead container is noticed through the ICMP unreachable the
# host answers with; a dead host is not, until its replica comes back.

worker_processes auto;
error_log /dev/stderr info;

events {
    worker_connections 8192;
}

# ---------------------------------------------------------------------
# Management API / web UI
# ---------------------------------------------------------------------
http {
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time "$upstream_addr"';
    access_log /dev/stdout main;

    # Every instance keeps its own in-memory copy of projects, credentials,
    # connectors and proxies and learns about the others' writes through
    # Redis a moment later, so a client that creates something on replica A
    # and immediately lists on replica B could miss its own write. Pinning
    # a client to one replica gives read-your-writes. The pin is the bearer
    # token, which the UI and API clients send on every call and which stays
    # the same for the life of a login: each signed-in user gets a replica,
    # rather than everyone behind one office address sharing one. Calls
    # without a token (login, the SPA assets, /health, /echo) fall back to
    # the client address; none of them need the pin. If the pinned replica
    # is down the request is retried on another.
    map $http_authorization $octoprox_api_key {
        ""       $remote_addr;
        default  $http_authorization;
    }

    upstream octoprox_api {
        hash $octoprox_api_key consistent;
        server octoprox-1:8000 max_fails=3 fail_timeout=10s;
        server octoprox-2:8000 max_fails=3 fail_timeout=10s;
        server octoprox-3:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8000;
        # IP database uploads (up to 512 MB) and backup imports.
        client_max_body_size 600m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location / {
            proxy_pass http://octoprox_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The /echo endpoint reports the caller's address; behind nginx
            # that would be nginx's own, so forward the client address and
            # list the nginx range in geo.echo.trusted_proxies on the instances.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}

# ---------------------------------------------------------------------
# Proxy traffic, WireGuard and OpenVPN
# ---------------------------------------------------------------------
stream {
    log_format basic '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time "$upstream_addr"';
    access_log /dev/stdout basic;

    # Long-lived tunnels: spread by open connections, not by turn.
    upstream octoprox_proxy {
        least_conn;
        server octoprox-1:8080 max_fails=3 fail_timeout=10s;
        server octoprox-2:8080 max_fails=3 fail_timeout=10s;
        server octoprox-3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        proxy_pass octoprox_proxy;
        proxy_connect_timeout 5s;
        # Inactivity, not duration: a tunnel that keeps moving bytes stays open.
        proxy_timeout 10m;
        proxy_next_upstream on;
    }

    # One WireGuard session lives on one replica (the session keys are
    # there), so a device must keep landing on the same one: consistent
    # hashing by source address does that, and keeps most devices in place
    # when a replica leaves or returns. All replicas share the server key
    # pair and peer list, so a device that is rehashed simply re-handshakes.
    upstream octoprox_wireguard {
        hash $remote_addr consistent;
        server octoprox-1:51820 fail_timeout=10s;
        server octoprox-2:51820 fail_timeout=10s;
        server octoprox-3:51820 fail_timeout=10s;
    }

    server {
        listen 51820 udp;
        proxy_pass octoprox_wireguard;
        # A session is forgotten after this long without a datagram; devices
        # send a keepalive every 25 seconds, so a live tunnel never hits it.
        proxy_timeout 10m;
    }

    # OpenVPN: one session lives on one replica, pinned by source address
    # like WireGuard. Every replica runs the daemon with the same CA and
    # device list, so a device rehashed elsewhere reconnects and is admitted.
    upstream octoprox_openvpn {
        hash $remote_addr consistent;
        server octoprox-1:1194 fail_timeout=10s;
        server octoprox-2:1194 fail_timeout=10s;
        server octoprox-3:1194 fail_timeout=10s;
    }

    server {
        listen 1194 udp;
        proxy_pass octoprox_openvpn;
        # Devices ping every 10 seconds (keepalive), so a live session never hits it.
        proxy_timeout 10m;
    }

    server {
        listen 1194;
        proxy_pass octoprox_openvpn;
        proxy_timeout 10m;
    }
}
