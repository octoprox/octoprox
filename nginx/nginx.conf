# nginx front for the Octoprox role cluster (docker-compose.cluster*.yml).
#
# Four listeners, each forwarded to the role that serves it:
#   :8000      Management API + web UI (HTTP, L7) -> api-{1,2}
#   :8080      Proxy traffic (raw TCP, L4: Octoprox speaks its own
#              CONNECT/SOCKS handshake, so nothing here may parse it)
#              -> gateway-{1,2}
#   :51820/udp WireGuard (UDP, L4: a device is pinned to one gateway by
#              its source address) -> gateway-{1,2}
#   :1194      OpenVPN (UDP and TCP, L4, same pinning; the daemons listen
#              on whichever transport the install's settings name, the
#              other stream server simply has nothing to connect to)
#              -> gateway-{1,2}
# The controllers and workers serve nothing here.
#
# Health is passive, as in open source nginx: a backend that refuses or
# times out is skipped for fail_timeout and the request or datagram goes
# to the next one. For HTTP and TCP, a container that is shutting down
# refuses at once; one that has stopped answers nothing, so the connect
# waits out proxy_connect_timeout (2 seconds) first. For UDP a dead
# container is noticed through the ICMP unreachable the host answers with;
# a dead host is not, until its gateway comes back.
#
# Backends are found by name through Docker's DNS, looked up again every
# 10 seconds (the resolver below, `resolve` on every server). A container
# that compose recreates comes back on a new address, and nginx follows it
# without a restart; nginx also starts while a backend is still down. Until
# the next lookup, nginx still tries a stopped container's old address; and
# once a lookup has changed the list, a connection that was waiting on that
# address is not passed on but fails (a 502 or 504 on the API, a closed
# connection on the proxy port). The short connect timeout keeps that to
# the few connections sent in the last 2 seconds before the lookup.

worker_processes auto;
error_log /dev/stderr info;

events {
    worker_connections 8192;
}

# ---------------------------------------------------------------------
# Management API / web UI
# ---------------------------------------------------------------------
http {
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time "$upstream_addr"';
    access_log /dev/stdout main;

    # Docker's embedded DNS server.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The api keeps no state of its own between requests (entities, the
    # provider catalog and the attribution settings are read from Postgres
    # on every request, live state from Redis), so any api answers any
    # request, a write included, and plain round robin is all it takes. The
    # copies each api keeps for its checks and lookups (custom provider
    # descriptors, attribution settings, the IP database list) follow a
    # write made through another api within about a second.
    upstream octoprox_api {
        zone octoprox_api 64k;
        server api-1:8000 resolve max_fails=3 fail_timeout=10s;
        server api-2:8000 resolve max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8000;
        # IP database uploads (up to 512 MB) and backup imports.
        client_max_body_size 600m;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # The internal API is for the cluster's own processes: a gateway
        # fetches IP database files from an api directly
        # (OCTOPROX_INTERNAL_API_URL), never through this front. It checks a
        # token as well; refusing it here keeps it off the public port.
        location ^~ /internal/ {
            deny all;
        }

        # Every process answers /metrics without sign-in, for a scraper on the
        # compose network that reaches each container's port 8000. Through
        # this front it would be whichever api round robin picked, so it
        # stays off the public port too.
        location = /metrics {
            deny all;
        }

        location / {
            proxy_pass http://octoprox_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # The /echo endpoint reports the caller's address; behind nginx
            # that would be nginx's own, so forward the client address and
            # list the nginx range in geo.echo.trusted_proxies on the api
            # services.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}

# ---------------------------------------------------------------------
# Proxy traffic, WireGuard and OpenVPN
# ---------------------------------------------------------------------
stream {
    log_format basic '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time "$upstream_addr"';
    access_log /dev/stdout basic;

    # Docker's embedded DNS server.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Long-lived tunnels: spread by open connections, not by turn.
    upstream octoprox_proxy {
        zone octoprox_proxy 64k;
        least_conn;
        server gateway-1:8080 resolve max_fails=3 fail_timeout=10s;
        server gateway-2:8080 resolve max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        proxy_pass octoprox_proxy;
        proxy_connect_timeout 2s;
        # Inactivity, not duration: a tunnel that keeps moving bytes stays open.
        proxy_timeout 10m;
        proxy_next_upstream on;
    }

    # One WireGuard session lives on one gateway (the session keys are
    # there), so a device must keep landing on the same one: consistent
    # hashing by source address does that, and keeps most devices in place
    # when a gateway leaves or returns. Every gateway runs the same server
    # key pair and device list (from the routing feed), so a device that is
    # rehashed simply re-handshakes.
    upstream octoprox_wireguard {
        zone octoprox_wireguard 64k;
        hash $remote_addr consistent;
        server gateway-1:51820 resolve fail_timeout=10s;
        server gateway-2:51820 resolve fail_timeout=10s;
    }

    server {
        listen 51820 udp;
        proxy_pass octoprox_wireguard;
        # A session is forgotten after this long without a datagram; devices
        # send a keepalive every 25 seconds, so a live tunnel never hits it.
        proxy_timeout 10m;
    }

    # OpenVPN: one session lives on one gateway, pinned by source address
    # like WireGuard. Every gateway runs the daemon with the same CA and
    # device list, so a device rehashed elsewhere reconnects and is admitted.
    upstream octoprox_openvpn {
        zone octoprox_openvpn 64k;
        hash $remote_addr consistent;
        server gateway-1:1194 resolve fail_timeout=10s;
        server gateway-2:1194 resolve fail_timeout=10s;
    }

    server {
        listen 1194 udp;
        proxy_pass octoprox_openvpn;
        # Devices ping every 10 seconds (keepalive), so a live session never hits it.
        proxy_timeout 10m;
    }

    server {
        listen 1194;
        proxy_pass octoprox_openvpn;
        proxy_timeout 10m;
    }
}
