[project]
name = "octoprox"
version = "6.4.0"
description = "A dynamic and flexible proxy manager"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0 AND LicenseRef-Octoprox-Provider-Descriptors" }
authors = [{ name = "Octoprox Team" }]

dependencies = [
    "fastapi==0.146.0",
    "starlette==1.9.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "httpx-socks[asyncio]==0.13.1",
    "python-socks[asyncio]==3.1.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "python-multipart==0.0.32",
    "python-jose[cryptography]==3.5.0",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.114",
    "google-cloud-compute==1.56.0",
    "azure-mgmt-compute==38.4.0",
    "azure-mgmt-network==33.1.0",
    "azure-identity==1.26.0",
    "blinker==1.9.0",
    "cryptography==50.0.2",
    "curl_cffi==0.16.3",
    "rnet==2.4.2",
    "h11==0.16.0",
    "bcrypt==5.0.0",
    "dpkt==1.9.8",
    "jmespath==1.1.0",
    "maxminddb==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "httpx==0.28.1",
    "httpx2==2.14.0",
    "testcontainers[postgres,redis]==4.15.0",
    "types-jmespath==1.1.0.20260724",
    "mmdb_writer==0.2.7",
]

[project.scripts]
octoprox = "api.main:run"

# Third-party provider plugins register here. Each entry point resolves to a
# ProviderDescriptor, a descriptor dict, a YAML path, or a provider class with
# a ``descriptor`` attribute. See docs/providers.md.
[project.entry-points."octoprox.providers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --cov=api --cov-report=term-missing"

