[project]
name = "octoprox"
version = "0.8.1"
description = "A dynamic and flexible proxy manager"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Octoprox Team" }]

dependencies = [
    "fastapi==0.128.7",
    "uvicorn[standard]==0.40.0",
    "httpx==0.28.1",
    "httpx-socks[asyncio]==0.11.0",
    "python-socks[asyncio]==2.8.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.12.0",
    "pyyaml==6.0.2",
    "aiohttp==3.11.13",
    "redis==7.1.1",
    "structlog==25.2.0",
    "prometheus-client==0.21.1",
    "python-multipart==0.0.20",
    "python-jose[cryptography]==3.5.0",
    "sqlalchemy[asyncio]==2.0.46",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "psycopg2-binary==2.9.11",
    "boto3==1.42.49",
    "google-cloud-compute==1.43.0",
    "azure-mgmt-compute==37.2.0",
    "azure-mgmt-network==30.1.0",
    "azure-identity==1.25.2",
    "blinker==1.9.0",
    "cryptography==46.0.5",
    "curl_cffi==0.14.0",
    "rnet==2.4.2",
    "h11==0.16.0",
    "bcrypt==5.0.0",
    "dpkt==1.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.6",
    "mypy==1.15.0",
    "httpx==0.28.1",
    "testcontainers[postgres,redis]==4.14.1",
]

[project.scripts]
octoprox = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --cov=api --cov-report=term-missing"

