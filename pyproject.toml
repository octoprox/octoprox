[project]
name = "octoprox"
version = "0.1.0"
description = "A dynamic and flexible proxy manager"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Octoprox Team" }]

dependencies = [
    "fastapi==0.128.7",
    "uvicorn[standard]==0.40.0",
    "httpx==0.28.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.12.0",
    "pyyaml==6.0.2",
    "aiohttp==3.11.13",
    "redis==5.2.1",
    "structlog==25.2.0",
    "prometheus-client==0.21.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.6",
    "mypy==1.15.0",
    "httpx==0.28.1",
]
cloud = [
    "boto3==1.36.22",
    "google-cloud-compute==1.23.0",
    "azure-mgmt-compute==34.0.0",
    "azure-mgmt-network==28.0.0",
    "azure-identity==1.21.0",
]

[project.scripts]
octoprox = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=api --cov-report=term-missing"

