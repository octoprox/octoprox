# One-off: a GitHub Release for each entry in docs/_data/releases.yml whose tag
# has none yet, which is every minor-version summary written before the notes
# began (v0.5.0 to v6.1.4). Run it once from the Actions tab (Run workflow),
# then delete this file; new tags get their release from ci.yml.
name: Backfill GitHub Releases

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Oldest first, so the releases list in version order; none is marked
      # Latest on the way, and the newest entry's release is marked at the end.
      # A tag that already has a release is left as it is, so a second run
      # changes nothing.
      - name: Publish the missing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -m pip install pyyaml==6.0.3
          versions=$(python -c "
          import yaml
          entries = yaml.safe_load(open('docs/_data/releases.yml'))
          versions = sorted((str(e['version']) for e in entries), key=lambda v: tuple(map(int, v.split('.'))))
          print(' '.join(versions))
          ")
          for version in $versions; do
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already has a release"
              continue
            fi
            python scripts/release_notes.py markdown "$tag" > release-notes.md
            gh release create "$tag" --title "Octoprox $version" --notes-file release-notes.md --verify-tag --latest=false
            echo "$tag released"
          done
          gh release edit "v${versions##* }" --latest
