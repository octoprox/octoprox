title: Octoprox
description: Open source proxy manager - one endpoint over cloud instances, provider sessions, static lists and tunnelled devices, with IP attribution, traffic limits and billing. A self-hosted replacement for Scrapoxy.
lang: en_US
logo: /assets/favicon/web-app-manifest-512x512.png
url: "https://www.octoprox.com"
baseurl: ""

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      # Extensionless URLs so canonical links and the sitemap match the nav links.
      permalink: /:basename
      image:
        path: /assets/og-image-v3.png
        width: 1200
        height: 630

include:
  - "*.html"
  - "*.md"


# GA4 measurement ID (G-XXXXXXXXXX). Leave empty to ship the site without the tag.
google_analytics: "G-TYM25G15XE"
