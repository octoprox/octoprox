<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octoprox - Proxy Manager</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Apply theme before React mounts to avoid FOUC.
      // Keep ids in sync with web/src/themes/index.ts.
      (function () {
        var ids = ['light','dark','solarized-light','solarized-dark','dracula','nord','high-contrast'];
        var darkIds = {'dark':1,'solarized-dark':1,'dracula':1,'nord':1,'high-contrast':1};
        var stored = null;
        try { stored = localStorage.getItem('octoprox_theme'); } catch (e) {}
        var id = (stored && ids.indexOf(stored) !== -1) ? stored : null;
        if (!id) {
          id = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        var isDark = !!darkIds[id];
        var root = document.documentElement;
        root.className = 'theme-' + id + (isDark ? ' dark' : '');
        root.setAttribute('data-theme-mode', isDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
