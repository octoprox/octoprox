#
# Bright Data - zones discovered from the account API (with passwords and, for
# ISP/datacenter zones, the owned exit IPs). Residential/mobile use global
# session ids; ISP/datacenter pin one exit IP per slot in the username.
id: brightdata
name: Bright Data
description: Residential, Mobile, ISP and Datacenter proxies via zones
docs_url: https://docs.brightdata.com/

credential_fields:
  - key: token
    label: API token
    type: password
    secret: true
    required: true
    help: Account-level API token from the Bright Data dashboard.

connector_fields:
  - key: zone_name
    label: Zone
    type: select
    required: true
    options_from: zones
    fill:
      zone_password: password
      proxy_type: proxy_type
    help: Proxy type and zone password follow the selected zone.
  - key: zone_password
    label: Zone password
    type: password
    secret: true
    required: true
    placeholder: Auto-filled from the zone
  - key: proxy_type
    label: Proxy type
    type: select
    required: true
    readonly: true
    help: Derived from the zone.
    options:
      - { value: residential, label: Residential }
      - { value: mobile, label: Mobile }
      - { value: isp, label: ISP }
      - { value: datacenter, label: Datacenter }
  - key: session_mode
    label: Sessions
    type: select
    default: pool
    options:
      - { value: pool, label: Fixed pool }
      - { value: dynamic, label: Dynamic (unlimited) }
    help: Fixed pool provisions "Number of proxies" sessions; dynamic creates a vendor session per request.
    details: >-
      Dynamic keeps one gateway proxy and renders the vendor credentials per request: a client -sessid-
      always maps to the same vendor session, a request without one gets a fresh session and the vendor
      rotates the exit, and -cc- picks the country per request. "Number of proxies" does not apply and the
      listed countries become an allow-list. The gateway is not health-checked and counts as healthy.
    show_when: { field: connector.proxy_type, in: [residential, mobile] }
  - key: exit_sample_percent
    label: Exit sampling (%)
    type: number
    default: 5
    min: 0
    max: 100
    help: Share of requests without a client session whose exit is checked before forwarding.
    details: >-
      Only preflight can see where a dynamic request went, by an echo request through the same vendor
      session before the real one. Requests with a -sessid- are checked once per session; this is the
      share of requests without one that are checked. Below 100 the unique-exit figures for that traffic
      are undercounts; 100 counts every exit at one echo per request. Applies under preflight "report", and
      to requests that name no country; under "reject" and "retry" every request that names a country is
      checked regardless.
    show_when: { field: connector.session_mode, equals: dynamic }
  - key: num_proxies
    label: Number of proxies
    type: number
    required: true
    default: 1
    min: 1
    max: 1000
    max_from_option:
      - { field: country_code, extra: count }
      - { field: zone_name, extra: total_ips }
    help: Per country when countries are listed.
    details: >-
      For ISP and datacenter zones the maximum is the number of IPs the zone (or the selected countries) has.
      Residential and mobile zones with no country also get this many sessions per country that clients
      request with -cc-, created the first time it is requested.
    show_when: { field: connector.session_mode, equals: dynamic, negate: true }
  - key: country_code
    label: Countries
    type: select
    options_preset: countries
    options_from: zone_countries
    options_from_when: { field: connector.proxy_type, in: [isp, datacenter] }
    empty_label: All countries
    help: Leave empty for all countries.
    details: >-
      Residential and mobile: "Number of proxies" sessions are created per listed country, geo-targeted in
      the username. ISP and datacenter zones list only the countries their IPs are in and pin "Number of
      proxies" IPs per listed country.
  - key: healthcheck_url
    label: Healthcheck URL
    type: url
    group: advanced
    placeholder: https://httpbin.org/ip (default)
    help: Use a custom URL if the zone is restricted to certain targets.

proxy_type_field: connector.proxy_type

session_id:
  length: 12
  alphabet: lower_digits
  prefix: glob_

validation:
  call:
    url: https://api.brightdata.com/status
    headers:
      Authorization: "Bearer {credential.token}"
  success: "status == 'active'"
  capture:
    customer_id: customer
  error_message: Invalid Bright Data API token or inactive account

options:
  zones:
    call:
      url: https://api.brightdata.com/zone/get_active_zones
      headers:
        Authorization: "Bearer {credential.token}"
    items: "@"
    value: name
    label: name
    description: "total_ips && join('', [proxy_type, ' (', type, ') - ', to_string(total_ips), ' IPs']) || join('', [proxy_type || 'unsupported', ' (', type, ')'])"
    extra:
      type: type
      proxy_type:
        path: type
        map:
          - { equals: res_static, to: isp }
          - { starts_with: res, to: residential }
          - { starts_with: mobile, to: mobile }
          - { starts_with: isp, to: isp }
          - { starts_with: dc, to: datacenter }
    enrich:
      - call:
          url: https://api.brightdata.com/zone
          params: { zone: "{item.value}" }
          headers:
            Authorization: "Bearer {credential.token}"
        merge:
          password: "password[0]"
      - call:
          url: https://api.brightdata.com/zone/route_ips
          params: { zone: "{item.value}", list_countries: "true" }
          headers:
            Authorization: "Bearer {credential.token}"
        when: "proxy_type == 'isp' || proxy_type == 'datacenter'"
        merge:
          total_ips: "length(@)"
    filter: "proxy_type && password"
    cache_seconds: 300

  zone_countries:
    call:
      url: https://api.brightdata.com/zone/route_ips
      params: { zone: "{connector.zone_name}", list_countries: "true" }
      headers:
        Authorization: "Bearer {credential.token}"
    items: "@"
    value: "country"
    label: "country"
    description: "join('', [to_string(count), ' IPs'])"
    group_by_value: true
    cache_seconds: 300

proxy_types:
  - key: residential
    label: Residential
    mode: session
    host: brd.superproxy.io
    port: 44445
    username:
      separator: "-"
      parts:
        - text: "brd-customer-{credential.customer_id}"
        - text: "zone-{connector.zone_name}"
        - text: "session-{session_id}"
        - text: "country-{connector.country_code|lower}"
          when: { field: connector.country_code }
    password: "{connector.zone_password}"
    tags: [brightdata, residential]
    metadata:
      zone_name: "{connector.zone_name}"
      country_code: "{connector.country_code}"

  - key: mobile
    label: Mobile
    mode: session
    host: brd.superproxy.io
    port: 44445
    username:
      separator: "-"
      parts:
        - text: "brd-customer-{credential.customer_id}"
        - text: "zone-{connector.zone_name}"
        - text: "session-{session_id}"
        - text: "country-{connector.country_code|lower}"
          when: { field: connector.country_code }
    password: "{connector.zone_password}"
    tags: [brightdata, mobile]
    metadata:
      zone_name: "{connector.zone_name}"
      country_code: "{connector.country_code}"

  - key: isp
    label: ISP
    mode: port
    port_strategy: fixed
    host: brd.superproxy.io
    port: 44445
    username:
      separator: "-"
      parts:
        - text: "brd-customer-{credential.customer_id}"
        - text: "zone-{connector.zone_name}"
        - text: "ip-{discovered_ip}"
          when: { field: discovered_ip }
        # A pinned IP fixes the exit; the country only steers the pre-pin
        # request (discovery fallback when the route_ips API is unavailable).
        - text: "country-{connector.country_code|lower}"
          when:
            - { field: connector.country_code }
            - { field: discovered_ip, negate: true }
    password: "{connector.zone_password}"
    discovery:
      url: https://lumtest.com/myip.json
      ip_path: ip
      country_path: country
    known_ips:
      call:
        url: https://api.brightdata.com/zone/route_ips
        params:
          zone: "{connector.zone_name}"
          list_countries: "true"
          country: "{connector.country_code|lower}"
        headers:
          Authorization: "Bearer {credential.token}"
      items: "@"
      ip: ip
      country: country
    tags: [brightdata, isp]
    metadata:
      zone_name: "{connector.zone_name}"
      country_code: "{connector.country_code}"
      index: "{index}"

  - key: datacenter
    label: Datacenter
    mode: port
    port_strategy: fixed
    host: brd.superproxy.io
    port: 44445
    username:
      separator: "-"
      parts:
        - text: "brd-customer-{credential.customer_id}"
        - text: "zone-{connector.zone_name}"
        - text: "ip-{discovered_ip}"
          when: { field: discovered_ip }
        # A pinned IP fixes the exit; the country only steers the pre-pin
        # request (discovery fallback when the route_ips API is unavailable).
        - text: "country-{connector.country_code|lower}"
          when:
            - { field: connector.country_code }
            - { field: discovered_ip, negate: true }
    password: "{connector.zone_password}"
    discovery:
      url: https://lumtest.com/myip.json
      ip_path: ip
      country_path: country
    known_ips:
      call:
        url: https://api.brightdata.com/zone/route_ips
        params:
          zone: "{connector.zone_name}"
          list_countries: "true"
          country: "{connector.country_code|lower}"
        headers:
          Authorization: "Bearer {credential.token}"
      items: "@"
      ip: ip
      country: country
    tags: [brightdata, datacenter]
    metadata:
      zone_name: "{connector.zone_name}"
      country_code: "{connector.country_code}"
      index: "{index}"
