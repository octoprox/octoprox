#
# IPRoyal residential - targeting, session id and lifetime are encoded in the
# proxy *password*. With an API token the entry nodes are discovered from the
# residential API. Marked beta until exercised against a live account.
id: iproyal
name: IPRoyal
description: Residential proxies with sticky sessions
docs_url: https://docs.iproyal.com/proxies/residential
beta: true

credential_fields:
  - key: username
    label: Proxy username
    required: true
  - key: password
    label: Proxy password
    type: password
    secret: true
    required: true
  - key: api_token
    label: API token (optional)
    type: password
    secret: true
    help: From Settings → API in the IPRoyal dashboard. Enables entry-node discovery and validation.

connector_fields:
  - key: entry_node
    label: Entry node
    type: select
    options_from: entry_nodes
    help: Defaults to geo.iproyal.com when not selected.
    show_when: { field: credential.api_token }
  - key: session_mode
    label: Sessions
    type: select
    default: pool
    options:
      - { value: pool, label: Fixed pool }
      - { value: dynamic, label: Dynamic (unlimited) }
    help: Fixed pool provisions "Number of proxies" sessions; dynamic creates a vendor session per request.
    details: >-
      Dynamic keeps one gateway proxy and renders the vendor credentials per request: a client -sessid-
      always maps to the same vendor session, a request without one gets a fresh session and the vendor
      rotates the exit, and -cc- picks the country per request. "Number of proxies" does not apply and the
      listed countries become an allow-list. The gateway is not health-checked and counts as healthy.
  - key: exit_sample_percent
    label: Exit sampling (%)
    type: number
    default: 5
    min: 0
    max: 100
    help: Share of requests without a client session whose exit is checked before forwarding.
    details: >-
      Only preflight can see where a dynamic request went, by an echo request through the same vendor
      session before the real one. Requests with a -sessid- are checked once per session; this is the
      share of requests without one that are checked. Below 100 the unique-exit figures for that traffic
      are undercounts; 100 counts every exit at one echo per request. Applies under preflight "report", and
      to requests that name no country; under "reject" and "retry" every request that names a country is
      checked regardless.
    show_when: { field: connector.session_mode, equals: dynamic }
  - key: num_proxies
    label: Number of proxies
    type: number
    required: true
    default: 1
    min: 1
    max: 1000
    help: Per country when countries are listed.
    details: >-
      With no country, this many sessions are created without a country plus this many per country that
      clients request with -cc-, the first time it is requested.
    show_when: { field: connector.session_mode, equals: dynamic, negate: true }
  - key: country_code
    label: Countries
    type: select
    options_preset: countries
    help: Leave empty for all countries.
    details: >-
      With no country, clients pick any with -cc- and sessions for it are created on first use. With
      countries listed, "Number of proxies" sessions are created per country right away, geo-targeted in
      the credentials.
  - key: session_lifetime
    label: Session lifetime
    default: 10m
    pattern: "^[0-9]+[smh]$"
    help: e.g. 5s, 10m, 24h.

session_id:
  length: 8
  alphabet: lower_digits

validation:
  when: { field: credential.api_token }
  call:
    url: https://resi-api.iproyal.com/v1/access/entry-nodes
    headers:
      Authorization: "Bearer {credential.api_token}"
  error_message: Invalid IPRoyal API token

options:
  entry_nodes:
    call:
      url: https://resi-api.iproyal.com/v1/access/entry-nodes
      headers:
        Authorization: "Bearer {credential.api_token}"
    items: "@"
    value: dns
    label: dns
    description: "join(', ', ips)"
    cache_seconds: 3600

proxy_types:
  - key: residential
    label: Residential
    mode: session
    host: "{connector.entry_node|or:geo.iproyal.com}"
    port: 12321
    username: "{credential.username}"
    password:
      separator: "_"
      parts:
        - text: "{credential.password}"
        - text: "country-{connector.country_code|lower}"
          when: { field: connector.country_code }
        - text: "session-{session_id}"
        - text: "lifetime-{connector.session_lifetime}"
          when: { field: connector.session_lifetime }
    tags: [iproyal, residential]
    metadata:
      country_code: "{connector.country_code}"
      session_lifetime: "{connector.session_lifetime}"
