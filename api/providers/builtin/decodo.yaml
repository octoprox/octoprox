#
# Decodo (formerly Smartproxy).
# Residential and mobile: sessions through gate.decodo.com:7000 with targeting
# and session length encoded in the username. ISP and datacenter: one exit IP
# per sticky gateway port (10001+) on isp.decodo.com / dc.decodo.com, discovered
# through the proxy; covers both pay-per-GB and pay-per-IP plans (ports iterate
# through purchased IPs). Like Oxylabs, each port is pinned to an IP and its
# location, so listed countries filter discovery rather than being sent in the
# username. Written from the public documentation; marked beta until exercised
# against a live account.
id: decodo
name: Decodo
description: Residential, Mobile, ISP and Datacenter proxies (formerly Smartproxy)
docs_url: https://help.decodo.com/
beta: true

credential_fields:
  - key: proxy_type
    label: Proxy type
    type: select
    required: true
    default: residential
    options:
      - { value: residential, label: Residential }
      - { value: mobile, label: Mobile }
      - { value: isp, label: ISP }
      - { value: datacenter, label: Datacenter }
  - key: username
    label: Proxy username
    required: true
    help: The proxy (sub-)user name, without the "user-" prefix.
  - key: password
    label: Proxy password
    type: password
    secret: true
    required: true
  - key: api_key
    label: API key (optional)
    type: password
    secret: true
    help: When set, the key is verified against the Decodo public API on save.

connector_fields:
  - key: session_mode
    label: Sessions
    type: select
    default: pool
    options:
      - { value: pool, label: Fixed pool }
      - { value: dynamic, label: Dynamic (unlimited) }
    help: Fixed pool provisions "Number of proxies" sessions; dynamic creates a vendor session per request.
    details: >-
      Dynamic keeps one gateway proxy and renders the vendor credentials per request: a client -sessid-
      always maps to the same vendor session, a request without one gets a fresh session and the vendor
      rotates the exit, and -cc- picks the country per request. "Number of proxies" does not apply and the
      listed countries become an allow-list. The gateway is not health-checked and counts as healthy.
    show_when: { field: credential.proxy_type, in: [residential, mobile] }
  - key: exit_sample_percent
    label: Exit sampling (%)
    type: number
    default: 5
    min: 0
    max: 100
    help: Share of requests without a client session whose exit is checked before forwarding.
    details: >-
      Only preflight can see where a dynamic request went, by an echo request through the same vendor
      session before the real one. Requests with a -sessid- are checked once per session; this is the
      share of requests without one that are checked. Below 100 the unique-exit figures for that traffic
      are undercounts; 100 counts every exit at one echo per request. Applies under preflight "report", and
      to requests that name no country; under "reject" and "retry" every request that names a country is
      checked regardless.
    show_when: { field: connector.session_mode, equals: dynamic }
  - key: num_proxies
    label: Number of proxies
    type: number
    required: true
    default: 1
    min: 1
    max: 1000
    help: Per country when countries are listed.
    details: >-
      Residential and mobile pools with no country also get this many sessions per country that clients
      request with -cc-, created the first time it is requested. ISP and datacenter keep this many ports
      per listed country.
    show_when: { field: connector.session_mode, equals: dynamic, negate: true }
  - key: country_code
    label: Countries
    type: select
    options_preset: countries
    help: Leave empty for all countries.
    details: >-
      Residential and mobile: "Number of proxies" sessions are created per listed country, geo-targeted in
      the username. ISP and datacenter: gateway ports are scanned and only IPs located in the listed
      countries are kept, "Number of proxies" per country, until the ports run out.
  - key: session_duration_minutes
    label: Session duration (minutes)
    type: number
    default: 10
    min: 1
    max: 1440
    show_when: { field: credential.proxy_type, in: [residential, mobile] }

proxy_type_field: credential.proxy_type

validation:
  when: { field: credential.api_key }
  call:
    url: https://api.decodo.com/v2/subscriptions
    headers:
      Authorization: "{credential.api_key}"
  error_message: Invalid Decodo API key

proxy_types:
  - key: residential
    label: Residential
    mode: session
    host: gate.decodo.com
    port: 7000
    username:
      separator: "-"
      parts:
        - text: "user-{credential.username}"
        - text: "country-{connector.country_code|lower}"
          when: { field: connector.country_code }
        - text: "session-{session_id}"
        - text: "sessionduration-{connector.session_duration_minutes}"
          when: { field: connector.session_duration_minutes }
    password: "{credential.password}"
    tags: [decodo, residential]
    metadata:
      country_code: "{connector.country_code}"
      session_duration_minutes: "{connector.session_duration_minutes}"

  - key: mobile
    label: Mobile
    mode: session
    host: gate.decodo.com
    port: 7000
    username:
      separator: "-"
      parts:
        - text: "user-{credential.username}"
        - text: "country-{connector.country_code|lower}"
          when: { field: connector.country_code }
        - text: "session-{session_id}"
        - text: "sessionduration-{connector.session_duration_minutes}"
          when: { field: connector.session_duration_minutes }
    password: "{credential.password}"
    tags: [decodo, mobile]
    metadata:
      country_code: "{connector.country_code}"
      session_duration_minutes: "{connector.session_duration_minutes}"

  - key: isp
    label: ISP
    mode: port
    port_strategy: sequential
    host: isp.decodo.com
    port: 10001
    username:
      separator: "-"
      parts:
        - text: "user-{credential.username}"
    password: "{credential.password}"
    discovery:
      url: https://ip.decodo.com/json
      ip_path: proxy.ip
      country_path: country.code
    tags: [decodo, isp]
    metadata:
      port: "{port}"

  - key: datacenter
    label: Datacenter
    mode: port
    port_strategy: sequential
    host: dc.decodo.com
    port: 10001
    username:
      separator: "-"
      parts:
        - text: "user-{credential.username}"
    password: "{credential.password}"
    discovery:
      url: https://ip.decodo.com/json
      ip_path: proxy.ip
      country_path: country.code
    tags: [decodo, datacenter]
    metadata:
      port: "{port}"
