#
# NetNut - one gateway for every product; the product token (res, stc, mob, dc),
# country and a numeric session id are encoded in the username. Based on public
# documentation and third-party integration guides; marked beta until exercised
# against a live account.
id: netnut
name: NetNut
description: Residential, Static residential (ISP), Mobile and Datacenter proxies
docs_url: https://netnut.ai/
beta: true

credential_fields:
  - key: proxy_type
    label: Proxy type
    type: select
    required: true
    default: residential
    options:
      - { value: residential, label: Residential (rotating) }
      - { value: static_residential, label: Static residential (ISP) }
      - { value: mobile, label: Mobile }
      - { value: datacenter, label: Datacenter }
  - key: username
    label: Username
    required: true
  - key: password
    label: Password
    type: password
    secret: true
    required: true

connector_fields:
  - key: session_mode
    label: Sessions
    type: select
    default: pool
    options:
      - { value: pool, label: Fixed pool }
      - { value: dynamic, label: Dynamic (unlimited) }
    help: Fixed pool provisions "Number of proxies" sessions; dynamic creates a vendor session per request.
    details: >-
      Dynamic keeps one gateway proxy and renders the vendor credentials per request: a client -sessid-
      always maps to the same vendor session, a request without one gets a fresh session and the vendor
      rotates the exit, -cc- picks the country per request and -st- and -city- narrow it. "Number of proxies" does not apply and the
      listed countries become an allow-list. The gateway is not health-checked and counts as healthy.
  - key: exit_sample_percent
    label: Exit sampling (%)
    type: number
    default: 5
    min: 0
    max: 100
    help: Share of requests without a -sessid- whose exit preflight checks. Requests with a -sessid- are always checked.
    details: >-
      Only with Preflight check on in the project. With it off, no request is checked, whatever this number,
      and none of the cases below applies.
      With a -sessid-: always checked, whatever this number, once per session and place. Later requests
      in that session reuse the result for the Preflight verdict cache in Settings (600 seconds by
      default), or for the vendor's session length when that is shorter.
      Without a -sessid-: this share of requests is checked. A check is one extra echo request through
      the vendor before the real one, so 100 means one echo per request. Below 100, unique-exit figures
      for that traffic are undercounts.
      Exception: when the request names a place (-cc-, -st-, -city-) or the connector lists countries,
      and the project's location decisions could refuse the exit, every request is checked whatever
      this number, since a sampled check guarantees nothing.
    show_when: { field: connector.session_mode, equals: dynamic }
  - key: num_proxies
    label: Number of proxies
    type: number
    required: true
    default: 1
    min: 1
    max: 1000
    help: Per country when countries are listed.
    details: >-
      With no country, this many sessions are created without a country plus this many per country that
      clients request with -cc-, the first time it is requested.
    show_when: { field: connector.session_mode, equals: dynamic, negate: true }
  - key: country_code
    label: Countries
    type: select
    options_preset: countries
    help: Leave empty for all countries.
    details: >-
      With no country, clients pick any with -cc- and sessions for it are created on first use. With
      countries listed, "Number of proxies" sessions are created per country right away, geo-targeted in
      the credentials.

proxy_type_field: credential.proxy_type

session_id:
  length: 8
  alphabet: digits

proxy_types:
  - key: residential
    label: Residential
    mode: session
    host: gw.netnut.net
    port: 5959
    username:
      separator: "-"
      parts:
        - text: "{credential.username}"
        - text: "res"
          when: { field: geo.city, negate: true }
        - text: "{geo.country|lower|or:any}"
          when: { field: geo.city, negate: true }
        # Dynamic sessions: a city is targeted as res_sc-<country>_<state name>_<city>,
        # which replaces the res-<country> pair; the state is required.
        - text: "res_sc-{geo.country|lower}_{geo.state_name}_{geo.city}"
          when: { field: geo.city }
        - text: "sid-{session_id}"
    password: "{credential.password}"
    targeting: { city_requires_state: true }
    tags: [netnut, residential]
    metadata:
      country_code: "{geo.country}"

  - key: static_residential
    label: Static residential (ISP)
    mode: session
    host: gw.netnut.net
    port: 5959
    username:
      separator: "-"
      parts:
        - text: "{credential.username}"
        - text: "stc"
        - text: "{geo.country|lower|or:any}"
        - text: "sid-{session_id}"
    password: "{credential.password}"
    tags: [netnut, static_residential]
    metadata:
      country_code: "{geo.country}"

  - key: mobile
    label: Mobile
    mode: session
    host: gw.netnut.net
    port: 5959
    username:
      separator: "-"
      parts:
        - text: "{credential.username}"
        - text: "mob"
          when: { field: geo.city, negate: true }
        - text: "{geo.country|lower|or:any}"
          when: { field: geo.city, negate: true }
        - text: "mob_sc-{geo.country|lower}_{geo.state_name}_{geo.city}"
          when: { field: geo.city }
        - text: "sid-{session_id}"
    password: "{credential.password}"
    targeting: { city_requires_state: true }
    tags: [netnut, mobile]
    metadata:
      country_code: "{geo.country}"

  - key: datacenter
    label: Datacenter
    mode: session
    host: gw.netnut.net
    port: 5959
    username:
      separator: "-"
      parts:
        - text: "{credential.username}"
        - text: "dc"
        - text: "{geo.country|lower|or:any}"
        - text: "sid-{session_id}"
    password: "{credential.password}"
    tags: [netnut, datacenter]
    metadata:
      country_code: "{geo.country}"
