#
# NetNut - one gateway for every product; the product token (res, stc, mob, dc),
# country and a numeric session id are encoded in the username. Based on public
# documentation and third-party integration guides; marked beta until exercised
# against a live account.
id: netnut
name: NetNut
description: Residential, Static residential (ISP), Mobile and Datacenter proxies
docs_url: https://netnut.ai/
beta: true

credential_fields:
  - key: proxy_type
    label: Proxy type
    type: select
    required: true
    default: residential
    options:
      - { value: residential, label: Residential (rotating) }
      - { value: static_residential, label: Static residential (ISP) }
      - { value: mobile, label: Mobile }
      - { value: datacenter, label: Datacenter }
  - key: username
    label: Username
    required: true
  - key: password
    label: Password
    type: password
    secret: true
    required: true

connector_fields:
  - key: session_mode
    label: Sessions
    type: select
    default: pool
    options:
      - { value: pool, label: Fixed pool }
      - { value: dynamic, label: Dynamic (unlimited) }
    help: Fixed pool provisions "Number of proxies" sessions; dynamic creates a vendor session per request.
    details: >-
      Dynamic keeps one gateway proxy and renders the vendor credentials per request: a client -sessid-
      always maps to the same vendor session, a request without one gets a fresh session and the vendor
      rotates the exit, and -cc- picks the country per request. "Number of proxies" does not apply and the
      listed countries become an allow-list. The gateway is not health-checked and counts as healthy.
  - key: exit_sample_percent
    label: Exit sampling (%)
    type: number
    default: 5
    min: 0
    max: 100
    help: Share of requests without a client session whose exit is checked before forwarding.
    details: >-
      Only preflight can see where a dynamic request went, by an echo request through the same vendor
      session before the real one. Requests with a -sessid- are checked once per session; this is the
      share of requests without one that are checked. Below 100 the unique-exit figures for that traffic
      are undercounts; 100 counts every exit at one echo per request. Applies under preflight "report", and
      to requests that name no country; under "reject" and "retry" every request that names a country is
      checked regardless.
    show_when: { field: connector.session_mode, equals: dynamic }
  - key: num_proxies
    label: Number of proxies
    type: number
    required: true
    default: 1
    min: 1
    max: 1000
    help: Per country when countries are listed.
    details: >-
      With no country, this many sessions are created without a country plus this many per country that
      clients request with -cc-, the first time it is requested.
    show_when: { field: connector.session_mode, equals: dynamic, negate: true }
  - key: country_code
    label: Countries
    type: select
    options_preset: countries
    help: Leave empty for all countries.
    details: >-
      With no country, clients pick any with -cc- and sessions for it are created on first use. With
      countries listed, "Number of proxies" sessions are created per country right away, geo-targeted in
      the credentials.

proxy_type_field: credential.proxy_type

session_id:
  length: 8
  alphabet: digits

proxy_types:
  - key: residential
    label: Residential
    mode: session
    host: gw.netnut.net
    port: 5959
    username:
      separator: "-"
      parts:
        - text: "{credential.username}"
        - text: "res"
        - text: "{connector.country_code|lower|or:any}"
        - text: "sid-{session_id}"
    password: "{credential.password}"
    tags: [netnut, residential]
    metadata:
      country_code: "{connector.country_code}"

  - key: static_residential
    label: Static residential (ISP)
    mode: session
    host: gw.netnut.net
    port: 5959
    username:
      separator: "-"
      parts:
        - text: "{credential.username}"
        - text: "stc"
        - text: "{connector.country_code|lower|or:any}"
        - text: "sid-{session_id}"
    password: "{credential.password}"
    tags: [netnut, static_residential]
    metadata:
      country_code: "{connector.country_code}"

  - key: mobile
    label: Mobile
    mode: session
    host: gw.netnut.net
    port: 5959
    username:
      separator: "-"
      parts:
        - text: "{credential.username}"
        - text: "mob"
        - text: "{connector.country_code|lower|or:any}"
        - text: "sid-{session_id}"
    password: "{credential.password}"
    tags: [netnut, mobile]
    metadata:
      country_code: "{connector.country_code}"

  - key: datacenter
    label: Datacenter
    mode: session
    host: gw.netnut.net
    port: 5959
    username:
      separator: "-"
      parts:
        - text: "{credential.username}"
        - text: "dc"
        - text: "{connector.country_code|lower|or:any}"
        - text: "sid-{session_id}"
    password: "{credential.password}"
    tags: [netnut, datacenter]
    metadata:
      country_code: "{connector.country_code}"
