apiVersion: v1
kind: Service
metadata:
  name: octoprox-api
  labels:
    app: octoprox
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 8000
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
  selector:
    app: octoprox
---
apiVersion: v1
kind: Service
metadata:
  name: octoprox-proxy
  labels:
    app: octoprox
spec:
  type: LoadBalancer
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
      protocol: TCP
  selector:
    app: octoprox
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: octoprox-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: octoprox.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: octoprox-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: octoprox-proxy
                port:
                  number: 8080

