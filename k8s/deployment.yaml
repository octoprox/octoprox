apiVersion: apps/v1
kind: Deployment
metadata:
  name: octoprox
  labels:
    app: octoprox
spec:
  replicas: 3
  selector:
    matchLabels:
      app: octoprox
  template:
    metadata:
      labels:
        app: octoprox
    spec:
      containers:
        - name: octoprox
          image: octoprox:latest
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: OCTOPROX_ENV
              value: "production"
            - name: OCTOPROX_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: octoprox-secrets
                  key: redis-url
            - name: OCTOPROX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: octoprox-secrets
                  key: database-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: octoprox-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: octoprox-config
data:
  prod.yaml: |
    server:
      host: "0.0.0.0"
      api_port: 8000
      proxy_port: 8080
      debug: false
    logging:
      level: INFO
      format: json
    proxy:
      default_strategy: health_based
      health_check:
        enabled: true
        interval_seconds: 60
---
apiVersion: v1
kind: Secret
metadata:
  name: octoprox-secrets
type: Opaque
stringData:
  redis-url: "redis://redis-service:6379/0"
  database-url: "postgresql+asyncpg://octoprox:changeme@postgres-service:5432/octoprox"

