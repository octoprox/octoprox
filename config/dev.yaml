# Development configuration for Octoprox
server:
  host: "0.0.0.0"
  api_port: 8000
  proxy_port: 8080
  debug: true
  reload: true

logging:
  level: DEBUG
  format: json
  
redis:
  url: "redis://localhost:6379/0"

database:
  host: "localhost"
  port: 5433
  user: "octoprox"
  password: "octoprox"
  name: "octoprox"
  application_name: "octoprox-dev"
  metrics_flush_interval: 60

proxy:
  # Default routing strategy: round_robin, least_used, random, sticky, health_based
  default_strategy: round_robin
  ip_refresh_interval: 3600
  
  # Health check settings
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 30
    unhealthy_threshold: 3
    healthy_threshold: 2
    
  # Connection settings
  connection:
    timeout_seconds: 30
    max_retries: 3
    retry_delay_seconds: 1
