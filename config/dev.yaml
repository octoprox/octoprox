# Development configuration for Octoprox
server:
  host: "0.0.0.0"
  api_port: 8000
  proxy_port: 8080

logging:
  level: DEBUG
  format: json
  
redis:
  url: "redis://localhost:6379/0"

database:
  host: "localhost"
  port: 5433
  user: "octoprox"
  password: "octoprox"
  name: "octoprox"
  application_name: "octoprox-dev"
  metrics_flush_interval: 60

system:
  # Install-wide gauge snapshots behind the admin System trend charts.
  # One row per interval for the whole install; retention alone bounds it.
  metrics_interval: 300
  metrics_retention_days: 90

proxy:
  # Default routing strategy: round_robin, least_used, random, sticky, health_based
  default_strategy: round_robin
  ip_refresh_interval: 3600
  
  # Health check settings
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 30
    unhealthy_threshold: 3
    healthy_threshold: 2
    

  # Exit-location lookup for manually added (static) proxies: one request is
  # made through each new proxy to learn its IP for -cc- routing. This also
  # seeds the IP attribution echo endpoint; point it at an Octoprox /echo in
  # production.
  geo_lookup:
    enabled: true
    url: https://httpbin.org/ip
    ip_path: origin
    country_path: ""
    timeout_seconds: 15
  # Connection settings
  connection:
    timeout_seconds: 30
    max_retries: 3
    retry_delay_seconds: 1

# IP attribution (see docs/ip-attribution.md). The live policy is edited in the
# admin panel; these settings describe this process and seed a fresh install.
geo:
  cache_dir: data/geo
  # Operator-managed database files, e.g. from geoipupdate on a shared volume:
  # databases:
  #   - path: /etc/octoprox/GeoLite2-City.mmdb
  #     priority: 10
  echo:
    enabled: true
    trusted_proxies: []
  observations:
    publish_interval_seconds: 5
    flush_interval_seconds: 30

# Proxy provider SDK (see docs/providers.md)
providers:
  # Directory of operator-supplied provider descriptor YAML files, loaded at startup.
  # dir: /etc/octoprox/providers
  egress:
    allow_http: false      # development only
    allow_private: false   # development only
  http:
    timeout_seconds: 60
    max_response_bytes: 52428800   # 0 disables the limit
