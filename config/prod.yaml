# Production configuration for Octoprox
#
# Note: Environment variables (OCTOPROX_*) take precedence over values in this file.
# Database and Redis settings can be overridden via:
#   OCTOPROX_REDIS_URL, OCTOPROX_DB_HOST, OCTOPROX_DB_USER, OCTOPROX_DB_PASSWORD, OCTOPROX_DB_NAME

server:
  host: "0.0.0.0"
  api_port: 8000
  proxy_port: 8080

logging:
  level: INFO
  format: json

redis:
  url: "redis://localhost:6379/0"

database:
  host: "localhost"
  port: 5432
  user: "octoprox"
  password: "octoprox"
  name: "octoprox"
  application_name: "octoprox"
  metrics_flush_interval: 60

system:
  # Install-wide gauge snapshots behind the admin System trend charts.
  # One row per interval for the whole install; retention alone bounds it.
  metrics_interval: 300
  metrics_retention_days: 90

proxy:
  default_strategy: health_based
  ip_refresh_interval: 3600

  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 30
    unhealthy_threshold: 3
    healthy_threshold: 2

  # Exit-location lookup for manually added (static) proxies: one request is
  # made through each new proxy to learn its IP and country for -cc- routing.
  geo_lookup:
    enabled: true
    url: https://httpbin.org/ip
    ip_path: origin
    country_path: ""
    timeout_seconds: 15

  connection:
    timeout_seconds: 30
    max_retries: 3
    retry_delay_seconds: 1

# Proxy provider SDK (see docs/providers.md)
providers:
  # Directory of operator-supplied provider descriptor YAML files, loaded at startup.
  # dir: /etc/octoprox/providers
  egress:
    allow_http: false      # development only
    allow_private: false   # development only
  http:
    timeout_seconds: 60
    max_response_bytes: 52428800   # 0 disables the limit

# Tunnel devices (see docs/wireguard.md). Devices with no proxy support join
# a project's pool through a tunnel this instance terminates. This block is
# the data plane every tunnel protocol shares: the listeners tunnel traffic
# is redirected to and how destination names are recovered.
tunnel:
  transparent_port: 8081   # bound on the tunnel gateway addresses only
  dns_port: 5353           # port 53 inside a tunnel is redirected here
  fake_ip_range: 198.18.0.0/15
  sniff_timeout_seconds: 2
  block_encrypted_dns: true   # DoT and known DoH resolvers are closed so devices keep the tunnel resolver

# The WireGuard tunnel. The key pair, public endpoint and subnet are
# install-wide and edited under Settings -> WireGuard; this block describes
# this process.
wireguard:
  enabled: false           # needs CAP_NET_ADMIN, wireguard-tools, nftables
  interface: wg0
  # listen_port: 51820     # only when it differs from the endpoint port (port-mapping NAT)
  mtu: 1420
  # Seed for the install-wide settings row on a fresh install:
  # defaults:
  #   endpoint_host: vpn.example.com
  #   endpoint_port: 51820
  #   subnet: 10.66.0.0/16
